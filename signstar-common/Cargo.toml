[package]
authors.workspace = true
description = "Common components for Signstar libraries and command-line interfaces"
edition.workspace = true
homepage.workspace = true
keywords = ["nethsm", "signstar", "user"]
license.workspace = true
name = "signstar-common"
repository.workspace = true
version = "0.2.0"

[dependencies]
base64ct.workspace = true
digest-io = { optional = true, version = "0.1.0" }
log.workspace = true
rand = { optional = true, workspace = true }
semver = { version = "1.0.28", features = ["serde"] }
serde = { optional = true, workspace = true }
serde_json = { optional = true, workspace = true }
sha2 = { optional = true, workspace = true }
simplelog = { optional = true, workspace = true }
systemd-journal-logger = { optional = true, version = "2.2.1" }
thiserror.workspace = true

[features]
logging = ["dep:simplelog", "dep:systemd-journal-logger"]
request-api = [
    "dep:digest-io",
    "dep:rand",
    "dep:serde_json",
    "dep:sha2",
    "serde",
]
serde = ["dep:serde"]

[lints]
workspace = true

[dev-dependencies]
rstest.workspace = true
testresult.workspace = true
