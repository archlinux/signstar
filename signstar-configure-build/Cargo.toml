[package]
authors.workspace = true
description = "A command-line interface for Signstar image build configuration"
edition.workspace = true
homepage.workspace = true
keywords = ["cli", "nethsm", "signstar", "user"]
license.workspace = true
name = "signstar-configure-build"
repository.workspace = true
version = "0.3.0"

[dependencies]
clap = { workspace = true, features = ["cargo", "derive", "env"] }
clap-verbosity-flag.workspace = true
log.workspace = true
nix.workspace = true
rand.workspace = true
signstar-common = { features = ["logging"], workspace = true }
signstar-config.workspace = true
strum.workspace = true
sysinfo = "0.39.0"
thiserror.workspace = true
yescrypt = { version = "0.1.0", features = ["rand_core"] }

[features]
_yubihsm2-mockhsm = ["yubihsm2"]
default = []
nethsm = ["signstar-config/nethsm"]
yubihsm2 = ["signstar-config/yubihsm2"]

[lints]
workspace = true
