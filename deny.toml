[advisories]
ignore = [
    "RUSTSEC-2023-0050", # nethsm-sdk-rs uses unmaintained multipart until something else becomes available: https://github.com/Nitrokey/nethsm-sdk-rs/issues/29
    "RUSTSEC-2023-0071", # side-channel attacks are not relevant for our use-case (only used in tests)
    "RUSTSEC-2026-0258", # low severity and used only in tests, can be removed when h2 v0.3.28 is released, see also https://github.com/actix/actix-web/issues/4199
    # Constant time issues do not affect our use-case, as we target HSM backends.
    # However, rpgp currently depends on the older set of rustcrypto releases, because that ecosystem is stuck in endless release mode (see also https://github.com/rpgp/rpgp/pull/573)
    "RUSTSEC-2026-0387",
]
version = 2
yanked = "deny"

[bans]
deny = []
multiple-versions = "allow"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
version = 2
