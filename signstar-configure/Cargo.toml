[package]
authors.workspace = true
description = "Runtime configuration tool for Signstar hosts"
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "signstar-configure"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[[bin]]
name = "signstar-configure"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { optional = true, workspace = true }
clap-verbosity-flag = { optional = true, workspace = true }
log.workspace = true
signstar-common.workspace = true
signstar-config.workspace = true
thiserror.workspace = true

[features]
_containerized-integration-test = [
    "signstar-common/logging",
    "signstar-config/_test-helpers",
]
_yubihsm2-mockhsm = ["signstar-config/_yubihsm2-mockhsm", "yubihsm2"]
cli = ["dep:clap", "dep:clap-verbosity-flag", "signstar-common/logging"]
default = ["cli", "nethsm", "yubihsm2"]
nethsm = ["signstar-config/nethsm"]
yubihsm2 = ["signstar-config/yubihsm2"]

[lints]
workspace = true

[dev-dependencies]
testresult.workspace = true
