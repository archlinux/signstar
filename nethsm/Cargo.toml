[package]
authors.workspace = true
description = "A high-level library to interact with the API of a Nitrokey NetHSM"
edition.workspace = true
homepage.workspace = true
keywords = ["encryption", "hsm", "nethsm", "signing"]
license.workspace = true
name = "nethsm"
repository.workspace = true
version = "0.11.0"

[dependencies]
aes-gcm = { version = "0.11.0", optional = true }
base64ct.workspace = true
chrono = { workspace = true, features = ["alloc"] }
clap = { workspace = true, optional = true }
confy = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, features = ["pem", "pkcs8"] }
expression_format = { version = "1.1.3", optional = true }
log = "0.4.22"
nethsm-sdk-rs.workspace = true
p256.workspace = true
p384.workspace = true
p521.workspace = true
picky-asn1-der = "0.5.1"
picky-asn1-x509 = "0.15.0"
rand.workspace = true
rpassword = { version = "7.3.1", optional = true }
rprompt = { version = "2.1.1", optional = true }
rsa.workspace = true
rstest = { optional = true, workspace = true }
rustainers = { optional = true, workspace = true }
scrypt = { version = "0.12.0", optional = true }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
signstar-common = { workspace = true, features = ["logging"] }
signstar-crypto = { version = "0.1.0", path = "../signstar-crypto", features = [
    "nethsm",
] }
signstar-request-signature = { workspace = true, optional = true }
strum.workspace = true
testresult = { optional = true, workspace = true }
thiserror.workspace = true
url = { version = "2.5.4", features = ["serde"] }
uuid = { optional = true, workspace = true }
zeroize = { workspace = true, optional = true }

[[bin]]
name = "nethsm"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
dirs = "7.0.0"
ed25519-dalek = { workspace = true, features = ["pem", "pkcs8", "rand_core"] }
rand = { workspace = true, features = ["chacha"] }
rsa = { workspace = true, features = ["getrandom", "sha2"] }
rstest.workspace = true
rustainers.workspace = true
testdir.workspace = true
testresult.workspace = true
tokio.workspace = true
uuid.workspace = true

[features]
_nethsm-integration-test = ["_test-helpers"]
_test-helpers = ["dep:rstest", "dep:rustainers", "dep:testresult", "dep:uuid"]
backup = ["dep:aes-gcm", "dep:scrypt"]
cli = [
    "backup",
    "dep:clap",
    "dep:confy",
    "dep:expression_format",
    "dep:rpassword",
    "dep:rprompt",
    "dep:signstar-request-signature",
    "dep:zeroize",
]
default = []

[lints]
workspace = true
